# Render.com Infrastructure as Code
# Deploy: push to GitHub → connect repo in Render → auto-deploys

services:
  # Backend API Service
  - type: web
    name: coinwake-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/server
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: WALLET_PROVIDER
        value: live
      - key: PRICE_POLL_INTERVAL_MS
        value: "20000"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:alerts@coinwake.app
      - key: CORS_ORIGIN
        value: https://coinwake.vercel.app,capacitor://localhost,http://localhost:8080

databases:
  # MongoDB is external (Atlas) - not managed by Render
  # Add your Atlas connection string to MONGODB_URI env var above